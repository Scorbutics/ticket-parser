[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-parser"
version = "0.1.0"
description = "WhatsApp -> GMX -> PDF bug intake pipeline"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.0.1",
    "jinja2==3.1.4",
    "playwright==1.47.0",
    "pillow==10.4.0",
    "pillow-heif==0.18.0",
]
# No WhatsApp chat-log parser: the sidecar delivers structured messages, so
# there is no `_chat.txt` to parse and no locale-dependent timestamp regex.

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]
# Offline, free speech-to-text for voice notes (CTranslate2 + Whisper
# weights). Optional so a plain `pip install -e .` stays light; without it
# the transcribe stage just leaves voice notes untranscribed.
transcribe = [
    "faster-whisper==1.0.3",
]

[project.scripts]
ticket-parser = "ticket_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
